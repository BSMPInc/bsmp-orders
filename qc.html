<style>
:root{
  --bg:#f5f2ea; --card:#ffffff; --surface:#ffffff;
  --text:#23262b; --text2:#5b6470; --text3:#8a93a0;
  --border:#e6e0d3; --border2:#d7d0c0;
  --accent:#3a4049; --accent-2:#23272e; --accent-soft:#eceef1; --spark:#d42b2b;
  --green:#1f7d57; --green-soft:#e7f1ec; --red:#a32d2d; --red-soft:#f7ebeb;
  --amber:#9a6212; --amber-soft:#f6efdf; --blue:#2c5d86;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --rail:64px; --sb:224px; --dock-h:64px; --radius:0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}

/* ===== Login ===== */
#qc-login{position:fixed;inset:0;background:var(--accent);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
#qc-login .card{background:#fff;padding:30px;width:340px;max-width:94vw;box-shadow:0 12px 48px rgba(0,0,0,.3)}
#qc-login .ttl{font-size:18px;font-weight:800;text-align:center}
#qc-login .sub{font-size:12px;color:var(--text2);text-align:center;margin:4px 0 18px}
#qc-login input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border2);background:#fff;outline:none;margin-bottom:10px}
#qc-login input:focus{border-color:var(--accent)}
#qc-login .err{font-size:12px;color:var(--red);min-height:15px;margin-bottom:6px}
#qc-login button{width:100%;height:40px;font-weight:700;color:#fff;background:var(--accent);border:none;cursor:pointer}
#qc-login button:hover{background:var(--accent-2)}
#qc-login .lang{display:flex;justify-content:center;gap:0;margin-top:14px}
#qc-login .lang button{width:auto;height:26px;padding:0 12px;background:#fff;color:var(--text3);border:1px solid var(--border);border-right:none;font-size:11px;font-weight:800}
#qc-login .lang button:last-child{border-right:1px solid var(--border)}
#qc-login .lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== Shell ===== */
#qc-app{display:none;min-height:100vh;width:100%}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--accent);display:flex;flex-direction:column;overflow:hidden;white-space:nowrap;z-index:48;transition:width .18s ease,box-shadow .18s ease;--label-op:0}
.sidebar:hover{width:var(--sb);--label-op:1;box-shadow:6px 0 28px rgba(0,0,0,.30)}
body.sb-pinned .sidebar{width:var(--sb);--label-op:1}
.logo-flag{position:fixed;left:0;top:0;z-index:50;width:var(--sb);height:84px;display:flex;align-items:center;padding:0 18px;background:var(--accent);box-shadow:4px 5px 16px rgba(0,0,0,.24);border-bottom:2.25px solid var(--spark)}
.logo-flag img{height:56px;width:auto;display:block}
.sidebar-top{height:84px;border-bottom:2.25px solid var(--spark);flex-shrink:0}
.nav{padding:8px 0;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-sec{padding:14px 18px 6px;font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.30);opacity:var(--label-op);transition:opacity .15s;white-space:nowrap}
.nav-item{position:relative;display:flex;align-items:center;gap:13px;padding:9px 20px;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);cursor:pointer}
.nav-item i{font-size:18px;flex:none;width:18px;text-align:center;opacity:.9}
.nav-item .nav-label{opacity:var(--label-op);transition:opacity .15s}
.nav-item:hover{color:rgba(255,255,255,.92);background:rgba(255,255,255,.05)}
.nav-item.active{color:#fff;background:rgba(255,255,255,.08)}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--spark)}
.sb-foot{height:46px;border-top:1px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:10px;padding:0 20px;flex-shrink:0}
.sb-foot .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none}
.sb-foot .lbl{font-size:11.5px;color:rgba(255,255,255,.6);opacity:var(--label-op);transition:opacity .15s;white-space:nowrap;overflow:hidden}
.pin-btn{margin-left:auto;flex-shrink:0;width:26px;height:26px;border:none;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:var(--label-op);transition:opacity .15s}
body.sb-pinned .pin-btn{background:var(--spark)}
.pin-btn i{font-size:15px}

main{margin-left:var(--rail);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .18s ease}
body.sb-pinned main{margin-left:var(--sb)}
.topbar{height:84px;background:var(--card);border-bottom:2.25px solid var(--spark);display:flex;align-items:center;gap:12px;padding:0 22px;padding-left:170px;position:sticky;top:0;z-index:30;transition:padding-left .18s ease}
body.sb-pinned .topbar{padding-left:22px}
.topbar h1{font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.topbar .sub{font-size:12px;color:var(--text2)}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 11px;border:1px solid var(--border);background:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#8a93a0}
#qc-lang{display:inline-flex;border:1px solid var(--border)}
#qc-lang button{height:30px;padding:0 10px;background:#fff;border:none;border-right:1px solid var(--border);font-weight:800;font-size:11px;color:var(--text3);cursor:pointer}
#qc-lang button:last-child{border-right:none}
#qc-lang button.on{background:var(--accent);color:#fff}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;color:var(--text2);cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.content{flex:1;padding:22px 22px calc(26px + var(--dock-h));max-width:1100px;width:100%}

/* ===== Dock ===== */
.dock{position:fixed;left:var(--rail);right:0;bottom:0;height:var(--dock-h);background:var(--card);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(16,24,40,.06);display:flex;align-items:stretch;padding-left:8px;z-index:46;transition:left .18s ease;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
body.sb-pinned .dock{left:var(--sb)}
.dock-tab{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text2);font-size:10.5px;font-weight:700;background:none;border:none;border-top:2.25px solid transparent;font-family:inherit;text-align:center}
.dock-tab i{font-size:19px}
.dock-tab.active{color:var(--accent);background:var(--accent-soft);border-top-color:var(--spark)}
.dock-tab:hover{color:var(--accent)}
.dock-switch{display:flex;align-items:center;gap:10px;padding-left:16px;margin-left:8px;border-left:1px solid var(--border)}
.dock-switch .lbl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.dock-chips{display:flex;gap:7px}
.dock-chip{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.92}
.dock-chip:hover{opacity:1}
.dock-chip.cur{outline:2px solid #fff;outline-offset:-2px;box-shadow:0 0 0 2px var(--accent)}
.dock-chip i{font-size:17px}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--border2);background:#fff;color:var(--text);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn i{font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:#e7c9c9}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.page-head{margin-bottom:16px}
.page-head h2{font-size:18px}
.page-head p{margin:3px 0 0;font-size:12.5px;color:var(--text2)}
.muted{color:var(--text3)}
.empty{padding:34px 16px;text-align:center;color:var(--text3);font-size:13px}

label.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text2);margin:0 0 5px}
.field{margin-bottom:13px}
.in,select.in,textarea.in{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--border2);background:#fff;outline:none}
.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent)}
textarea.in{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border)}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--accent-soft)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.flag{background:var(--red-soft);color:var(--red)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.neutral{background:var(--accent-soft);color:var(--text2)}

.char-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.char-tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--text3);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--border);text-align:left}
.char-tbl td{padding:4px 5px;border-bottom:1px solid var(--border);vertical-align:top}
.char-tbl input,.char-tbl textarea{width:100%;border:1px solid var(--border);background:#fff;padding:6px 7px;outline:none;min-height:32px}
.char-tbl input:focus,.char-tbl textarea:focus{border-color:var(--accent)}
.char-tbl .cno{width:48px;text-align:center;font-weight:700;color:var(--text2)}
.char-tbl .rm{color:var(--text3);cursor:pointer;text-align:center}
.char-tbl .rm:hover{color:var(--red)}
.char-tbl tr.oot td{background:var(--red-soft)}

.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{width:84px;height:84px;border:1px solid var(--border);object-fit:cover;background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--border2)}
.seg button{height:36px;padding:0 14px;background:#fff;border:none;border-right:1px solid var(--border2);cursor:pointer;font-weight:700;color:var(--text2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.res-pick{display:flex;gap:10px}
.res-pick .opt{flex:1;border:1px solid var(--border2);padding:14px;text-align:center;cursor:pointer;font-weight:800}
.res-pick .opt.pass.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.res-pick .opt.flag.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.hint{font-size:12px;color:var(--text3);margin-top:4px}
.aiwip{font-size:11.5px;color:var(--text3);border:1px dashed var(--border2);padding:9px 11px;margin-top:8px;display:flex;align-items:center;gap:8px}
.dz{border:1.5px dashed var(--border2);background:var(--bg);padding:18px;text-align:center;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;transition:border-color .15s,background .15s}
.dz:hover{border-color:var(--accent);color:var(--accent)}
.dz.drag{border-color:var(--accent);background:var(--accent-soft)}
.dz i{font-size:26px}
@keyframes qcspin{to{transform:rotate(360deg)}}
.ti.spin{display:inline-block;animation:qcspin .8s linear infinite}
.rv-results{border:1px solid var(--border);border-top:none;max-height:170px;overflow:auto}
.rv-results:empty{display:none}
.rv-opt{padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--border)}
.rv-opt:last-child{border-bottom:none}
.rv-opt:hover{background:var(--accent-soft)}
.qcv-ov{position:fixed;inset:0;background:rgba(16,20,26,.55);z-index:9500;display:none;align-items:center;justify-content:center;padding:24px}
.qcv{background:var(--card);width:min(980px,96vw);height:min(90vh,940px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.qcv-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.qcv-title{flex:1;min-width:0}
.qcv-h1{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.qcv-h2{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcv-actions{display:flex;gap:6px;flex-wrap:wrap}
.qcv-x{border:none;background:none;cursor:pointer;color:var(--text2);font-size:22px;padding:2px 4px;line-height:1}
.qcv-x:hover{color:var(--text)}
.qcv-tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:wrap}
.qcv-tab{border:1px solid var(--border);background:var(--bg);padding:5px 10px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:inherit}
.qcv-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.qcv-body{flex:1;min-height:0;background:#525659;display:flex}
.qcv-frame{width:100%;height:100%;border:none;background:#525659}
.qcv-imgwrap{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:12px}
.qcv-imgwrap img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
.cert-open{cursor:pointer}
.cert-open:hover{text-decoration:underline}
body.role-operator .mgr-only{display:none!important}
</style>
</head>
<body>

<!-- ===== Login gate ===== -->
<div id="qc-login">
  <div class="card">
    <div class="ttl"><span style="color:var(--accent)">BSMP</span> Inspection / QC</div>
    <div class="sub" data-t="Sign in to continue">Sign in to continue</div>
    <input id="qc-email" type="email" data-tph="Email" placeholder="Email" autocomplete="username">
    <input id="qc-pass" type="password" data-tph="Password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="qc-login-err"></div>
    <button id="qc-login-btn" data-t="Sign in" onclick="window._qcLogin()">Sign in</button>
    <div class="lang" id="qc-lang-login">
      <button data-lang="en" onclick="qcSetLang('en')">EN</button>
      <button data-lang="es" onclick="qcSetLang('es')">ES</button>
    </div>
  </div>
</div>

function getProxyUrl(){ try{ return (localStorage.getItem('bsmp_proxy_url')||'').trim(); }catch(e){ return ''; } }
function getApiKey(){ try{ return localStorage.getItem('bsmp_apikey')||''; }catch(e){ return ''; } }
function hasAIConnection(){ return !!(getProxyUrl()||getApiKey()); }
async function callAnthropic(payload){
  const proxy=getProxyUrl();
  if(proxy) return fetch(proxy,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const key=getApiKey();
  if(!key) throw new Error('no-connection');
  return fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(payload)});
}
function toBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
function aiContentBlock(b64, ext){
  const e=(ext||'').toLowerCase();
  if(e==='pdf') return {type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}};
  const mt = (e==='jpg'||e==='jpeg')?'image/jpeg':(e==='png'?'image/png':(e==='webp'?'image/webp':'image/'+e));
  return {type:'image',source:{type:'base64',media_type:mt,data:b64}};
}
function extFromFile(file){ const n=(file.name||'').toLowerCase(); const m=n.match(/\.([a-z0-9]+)$/); if(m) return m[1]; const tp=(file.type||''); if(tp.indexOf('pdf')>=0) return 'pdf'; if(tp.indexOf('png')>=0) return 'png'; if(tp.indexOf('jpeg')>=0||tp.indexOf('jpg')>=0) return 'jpg'; return 'png'; }
async function callAIJson(file, promptText){
  const b64=await toBase64(file);
  const resp=await callAnthropic({ model:'claude-sonnet-4-6', max_tokens:1200, messages:[{role:'user',content:[aiContentBlock(b64, extFromFile(file)), {type:'text',text:promptText}]}] });
  const data=await resp.json();
  if(data.error) throw new Error(data.error.message||'AI error');
  const raw=(data.content||[]).map(c=>c.text||'').join('');
  let clean=raw.replace(/```json/gi,'').replace(/```/g,'').trim();
  const fb=clean.indexOf('{'), lb=clean.lastIndexOf('}');
  if(fb>=0 && lb>fb) clean=clean.slice(fb,lb+1);
  clean=clean.replace(/,\s*}/g,'}').replace(/,\s*]/g,']');
  return JSON.parse(clean);
}
function setAIStatus(elId, state, msg){
  const el=$(elId); if(!el) return;
  el.style.display='flex';
  const ic = state==='loading'?'ti-loader-2 spin':(state==='ok'?'ti-sparkles':(state==='error'?'ti-alert-triangle':'ti-sparkles'));
  const col = state==='error'?'var(--red)':(state==='ok'?'var(--green)':'var(--text3)');
  el.style.color=col; el.innerHTML=`<i class="ti ${ic}"></i> ${esc(msg)}`;
}

const CERT_PROMPT='You are reading a received material package for a sheet metal shop. It may contain ONE or SEVERAL distinct material certifications / mill test reports (different heats or lots). Respond with ONLY valid JSON, no markdown or extra text:\n{"certs":[{"material":null,"spec":null,"heat_lot":null,"supplier":null,"mill":null,"cert_no":null,"cert_date":null,"size_thickness":null,"qty":null,"po_number":null,"country_of_origin":null,"itar":false,"doc":1,"pages":null}]}\nCreate one array element per DISTINCT certificate (distinct heat/lot, or distinct material plus cert number). If the package is a single certificate, return exactly one element. doc=the 1-based Document number (as labeled below) this certificate appears in. pages=for a multi-page PDF document, the 1-based page numbers within that document that make up THIS certificate (e.g. [1,2]); use null when the document is a single page or a single image. Field rules: material=alloy/grade/temper e.g. "6061-T6","304/304L SS","A36". spec=governing specification(s) e.g. "AMS 4027","ASTM B209","ASTM A240". heat_lot=heat and/or lot exactly as printed. supplier=distributor/vendor who shipped it. mill=producing mill if different. cert_no=certificate/document number. cert_date=YYYY-MM-DD. size_thickness=size/gauge/thickness. qty=quantity or weight. po_number=purchase order referenced. country_of_origin=melt/manufacture country if stated. itar=true only if explicitly export-controlled.';
async function callAICerts(files){
  const content=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    content.push({type:'text',text:'=== Document '+(i+1)+': '+(f.name||('file'+(i+1)))+' ==='});
    content.push(aiContentBlock(await toBase64(f), extFromFile(f)));
  }
  content.push({type:'text',text:CERT_PROMPT});
  const resp=await callAnthropic({ model:'claude-sonnet-4-6', max_tokens:2000, messages:[{role:'user',content}] });
  const data=await resp.json();
  if(data.error) throw new Error(data.error.message||'AI error');
  const raw=(data.content||[]).map(c=>c.text||'').join('');
  let clean=raw.replace(/```json/gi,'').replace(/```/g,'').trim();
  const fb=clean.indexOf('{'), lb=clean.lastIndexOf('}');
  if(fb>=0&&lb>fb) clean=clean.slice(fb,lb+1);
  clean=clean.replace(/,\s*}/g,'}').replace(/,\s*]/g,']');
  const parsed=JSON.parse(clean);
  let certs=Array.isArray(parsed)?parsed:(parsed.certs||(parsed.material!==undefined?[parsed]:[]));
  return Array.isArray(certs)?certs:[];
}

function normalizeDetected(c){

  return { material:c.material||'', spec:c.spec||'', heat_lot:c.heat_lot||'', supplier:c.supplier||'', mill:c.mill||'',
    cert_no:c.cert_no||'', cert_date:(String(c.cert_date||'').match(/\d{4}-\d{2}-\d{2}/)||[''])[0], size_thickness:c.size_thickness||'',
    qty:c.qty!=null?String(c.qty):'', po_number:c.po_number||'', country_of_origin:c.country_of_origin||'', itar:c.itar===true,
    doc:Number(c.doc)||1, pages:Array.isArray(c.pages)?c.pages.map(n=>+n).filter(n=>Number.isFinite(n)&&n>0):null, _linked:linked };
}
async function analyzeCertPacket(){
  if(!hasAIConnection()){ setAIStatus('cert-ai','error',t('No AI connection set — open the Quote app Settings to add a proxy URL, then retry.')); return; }
  const files=[...(_pendingFiles['cert']||[])];

      setAIStatus('cert-ai','ok', filled?t('AI filled the fields below — check them before saving.'):t('AI could not read the cert. Fill the fields by hand.'));

  }
}
// split a PDF into a new File containing only the given 1-based pages
async function splitPdfPages(file, pages){
  if(typeof PDFLib==='undefined') return file;
  try{
    const src=await PDFLib.PDFDocument.load(await file.arrayBuffer());
    const total=src.getPageCount();
    const idx=pages.map(p=>p-1).filter(i=>i>=0&&i<total);
    if(!idx.length) return file;
    const out=await PDFLib.PDFDocument.create();
    (await out.copyPages(src, idx)).forEach(p=>out.addPage(p));
    const bytes=await out.save();
    const base=(file.name||'cert').replace(/\.pdf$/i,'');
    return new File([bytes], base+'_p'+pages.join('-')+'.pdf', {type:'application/pdf'});
  }catch(e){ console.warn('pdf split failed',e); return file; }
}
function isPdf(f){ return f && ((f.type||'').indexOf('pdf')>=0 || /\.pdf$/i.test(f.name||'')); }
async function buildCertFile(cert, files){
  let src=files[(cert.doc||1)-1]||files[0]||null;
  if(cert.pages && cert.pages.length){
    if(!isPdf(src)){ const pdfs=files.filter(isPdf); if(pdfs.length===1) src=pdfs[0]; }
    if(isPdf(src)) return await splitPdfPages(src, cert.pages);
  }
  return src;
}
// pre-link any order whose PO matches
function qcAutoLinkByPO(po){
  const norm=s=>String(s||'').replace(/[^a-z0-9]/gi,'').toLowerCase();
  const target=norm(po); if(!target) return;
  let matched=0;
  vals(ORDERS).forEach(o=>{ if(norm(o.po)===target && !_certLinks.includes(o.id)){ _certLinks.push(o.id); matched++; } });
  if(matched){ const el=$('cert-chips'); if(el) el.innerHTML=certLinkChips(); }
}
function certLinkChips(){
  return _certLinks.map(oid=>{ const o=ORDERS[oid]; const lbl=o?rvOrderLabel(o):oid;
    return `<span class="badge neutral" style="gap:6px">${esc(lbl)} <i class="ti ti-x" style="cursor:pointer" onclick="qcCertUnlink('${esc(oid)}')"></i></span>`;
  }).join(' ')||('<span class="muted">—</span>');
}
window.qcCertUnlink=(oid)=>{ _certLinks=_certLinks.filter(x=>x!==oid); const el=$('cert-chips'); if(el) el.innerHTML=certLinkChips(); };
window.qcCertLink=(oid)=>{ if(!_certLinks.includes(oid)) _certLinks.push(oid); const el=$('cert-chips'); if(el) el.innerHTML=certLinkChips(); const b=$('cert-order-results'); if(b) b.innerHTML=''; const s=$('cert-order-search'); if(s) s.value=''; };
window.qcCertSearch=(q)=>{
  const box=$('cert-order-results'); if(!box) return;
  const s=String(q||'').trim().toLowerCase();
  if(!s){ box.innerHTML=''; return; }
  const linked=new Set(_certLinks);
  const matches=vals(ORDERS).map(o=>({o,lbl:rvOrderLabel(o)}))
    .filter(x=>!linked.has(x.o.id) && (x.lbl+' '+(x.o.po||'')).toLowerCase().indexOf(s)>=0).slice(0,10);
  box.innerHTML=matches.length?matches.map(x=>`<div class="rv-opt" onclick="qcCertLink('${esc(x.o.id)}')">${esc(x.lbl||x.o.id)}</div>`).join(''):`<div class="rv-opt muted">${t('No orders found.')}</div>`;
};

/* ---------- vendor invoice drop + AI ---------- */
window.qcInvDrop=(e)=>{ e.preventDefault(); e.currentTarget.classList.remove('drag'); qcIngestInvoice([...(e.dataTransfer&&e.dataTransfer.files||[])]); };
window.qcInvPick=(inp)=>{ const f=[...inp.files]; inp.value=''; qcIngestInvoice(f); };
function qcIngestInvoice(files){
  if(!files.length) return;
  _pendingFiles['invoice']=_pendingFiles['invoice']||[];
  files.forEach(f=>_pendingFiles['invoice'].push(f));
  qcRenderStrip('invoice');
  analyzeInvoice(files[0]);
}
async function analyzeInvoice(file){
  if(!hasAIConnection()){ setAIStatus('inv-ai','error',t('No AI connection set — open the Quote app Settings to add a proxy URL, then retry.')); return; }
  setAIStatus('inv-ai','loading',t('Reading invoice with AI…'));
  const prompt='You are reading a vendor invoice for a material purchase. Respond with ONLY a valid JSON object, no markdown or extra text. Use null when absent.\n{"invoice_no":null,"invoice_date":null,"amount":null,"vendor":null,"po_number":null}\nRules: amount=invoice grand total as a plain number, no currency symbol. invoice_date=YYYY-MM-DD. vendor=the company that issued the invoice. po_number=purchase order referenced.';
  try{
    const d=await callAIJson(file, prompt);
    const setV=(id,v)=>{ const el=$(id); if(el && v!=null && v!=='') el.value=String(v); };
    setV('inv-no', d.invoice_no); setV('inv-amount', d.amount); setV('inv-vendor', d.vendor);
    if(d.invoice_date){ const el=$('inv-date'); if(el){ const m=String(d.invoice_date).match(/\d{4}-\d{2}-\d{2}/); if(m) el.value=m[0]; } }
    if(d.po_number && !gv('ct-po')){ const el=$('ct-po'); if(el) el.value=String(d.po_number); }
    setAIStatus('inv-ai','ok', t('AI filled the fields below — check them before saving.'));
  }catch(e){
    setAIStatus('inv-ai','error', e.message==='no-connection'?t('No AI connection set — open the Quote app Settings to add a proxy URL, then retry.'):(t('AI could not read the cert. Fill the fields by hand.')));
  }
}

  editId=null; _chars=[]; page='fairs'; render();

window.qcSaveNcr=async (action)=>{

  });

/* =================== CERT VIEWER (view + print the actual PDF) =================== */
function qcFileKind(f){ const s=((f&&f.url)||'')+' '+((f&&f.name)||'')+' '+((f&&f.type)||''); return /pdf/i.test(s)?'pdf':'img'; }
function qcPrintFile(url,kind){
  const isPdf=(kind==='pdf')|| /pdf/i.test(kind||'') || /\.pdf($|\?)/i.test(url||'');
  if(isPdf){
    const w=window.open(url,'_blank');
    if(w){ const p=()=>{ try{ w.focus(); w.print(); }catch(e){} }; try{ w.addEventListener('load',p); }catch(e){} setTimeout(p,1400); }
  } else {
    const w=window.open('','_blank','width=900,height=760');
    if(w){ w.document.write('<!doctype html><title>'+t('Print')+'</title><body style="margin:0;display:flex;align-items:center;justify-content:center"><img src="'+url+'" style="max-width:100%;max-height:100vh" onload="setTimeout(function(){window.focus();window.print();},200)"></body>'); w.document.close(); }
  }
}
let _certView=null;
window.qcViewCert=(id,startIdx)=>{
  const c=CERTS[id]; if(!c) return;
  const files=[];
  const cf=c.files?vals(c.files):(c.file?[c.file]:[]);
  cf.forEach((f,i)=>{ if(f&&f.url) files.push({url:f.url,name:f.name||(t('Cert')+' '+(i+1)),kind:qcFileKind(f),tag:'cert'}); });
  const inv=c.invoice||{};
  if(inv.file&&inv.file.url) files.push({url:inv.file.url,name:inv.file.name||t('Invoice'),kind:qcFileKind(inv.file),tag:'invoice'});
  if(!files.length){ alert(t('No file is attached to this cert yet.')); return; }
  _certView={ id, c, files, idx: Math.min(startIdx||0, files.length-1) };
  qcvMount(); qcvRender();
};
function qcvMount(){
  let ov=$('qcv-ov');
  if(!ov){
    ov=document.createElement('div'); ov.id='qcv-ov'; ov.className='qcv-ov';
    ov.innerHTML='<div class="qcv" role="dialog" aria-modal="true"><div class="qcv-head"><div class="qcv-title" id="qcv-title"></div><div class="qcv-actions" id="qcv-actions"></div><button class="qcv-x" onclick="qcvClose()" aria-label="Close"><i class="ti ti-x"></i></button></div><div class="qcv-tabs" id="qcv-tabs"></div><div class="qcv-body" id="qcv-body"></div></div>';
    ov.addEventListener('click',e=>{ if(e.target===ov) qcvClose(); });
    document.body.appendChild(ov);
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const o=$('qcv-ov'); if(o&&o.style.display!=='none') qcvClose(); } });
  }
  ov.style.display='flex';
}
window.qcvClose=()=>{ const ov=$('qcv-ov'); if(ov){ ov.style.display='none'; const b=$('qcv-body'); if(b) b.innerHTML=''; } _certView=null; };
window.qcvGo=(i)=>{ if(_certView){ _certView.idx=i; qcvRender(); } };
window.qcvPrint=()=>{ if(_certView){ const f=_certView.files[_certView.idx]; if(f) qcPrintFile(f.url,f.kind); } };
window.qcvOpen=()=>{ if(_certView){ const f=_certView.files[_certView.idx]; if(f) window.open(f.url,'_blank'); } };
function qcvRender(){
  const V=_certView; if(!V) return; const c=V.c, f=V.files[V.idx];
  $('qcv-title').innerHTML=`<div class="qcv-h1">${esc(c.material||t('Material cert'))}${c.itar?' <span class="badge flag">ITAR</span>':''}</div>`+
    `<div class="qcv-h2">${[c.heatLot?(t('Heat / Lot')+' '+esc(c.heatLot)):'',c.certNo?(t('Cert #')+' '+esc(c.certNo)):'',esc(c.supplier||'')].filter(Boolean).join(' · ')}</div>`;
  $('qcv-actions').innerHTML=`<button class="btn sm primary" onclick="qcvPrint()"><i class="ti ti-printer"></i> ${t('Print')}</button><button class="btn sm" onclick="qcvOpen()"><i class="ti ti-external-link"></i> ${t('Open in new tab')}</button>`;
  $('qcv-tabs').innerHTML=V.files.length>1?V.files.map((x,i)=>`<button class="qcv-tab${i===V.idx?' on':''}" onclick="qcvGo(${i})"><i class="ti ti-${x.tag==='invoice'?'file-dollar':'file'}"></i> ${esc(x.name)}</button>`).join(''):'';
  const body=$('qcv-body');
  if(f.kind==='pdf') body.innerHTML=`<iframe class="qcv-frame" src="${esc(f.url)}#toolbar=1" title="${esc(f.name)}"></iframe>`;
  else body.innerHTML=`<div class="qcv-imgwrap"><img src="${esc(f.url)}" alt="${esc(f.name)}"></div>`;
}

        ${F(i,'qty',t('Qty'))}${F(i,'po_number',t('PO #'))}
        ${F(i,'country_of_origin',t('Country of origin'))}
      </div>
      <div class="field"><label class="fl" style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${c.itar?'checked':''} onchange="qcRvEdit(${i},'itar',this.checked)" style="width:auto;min-height:0"> ${t('Restricted / ITAR')}</label></div>
      <div class="field"><label class="fl">${t('Linked orders')}</label>
        <div id="rv-chips-${i}" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px">${rvChipsHtml(i)}</div>
        <input class="in" placeholder="${t('Search orders…')}" oninput="qcRvSearch(${i},this.value)">
        <div id="rv-results-${i}" class="rv-results"></div>
      </div>
    </div>`;
  }).join('');
  return `<div class="page-head"><h2>${t('Review detected certs')}</h2><p>${t('AI found multiple certs in this packet. Check each one, then save.')}</p></div>
  <div class="toolbar">
    <button class="btn primary" onclick="window.qcSaveReviewedCerts()"><i class="ti ti-device-floppy"></i> ${t('Save all')} (${P.detected.length})</button>
    <button class="btn" onclick="qcCancelReview()">${t('Cancel')}</button>
    <span class="muted" id="rv-status" style="font-size:12px"></span>
  </div>
  ${cards}
  <div class="card"><div class="field"><label class="fl">${t('Vendor invoice')} — ${t('applies to all certs in this packet')}</label>
    <div class="dz" ondragover="qcDragOver(event)" ondragleave="qcDragLeave(event)" ondrop="qcInvDrop(event)" onclick="this.querySelector('input').click()">
      <i class="ti ti-file-dollar"></i><div>${t('Drop invoice here or click to add — AI reads invoice #, date and amount.')}</div>
      <input type="file" accept=".pdf,image/*" style="display:none" onchange="qcInvPick(this)">
    </div>
    <div class="thumbs" id="files-invoice"></div>
    <div class="aiwip" id="inv-ai" style="display:none"></div>
    <div class="grid2" style="margin-top:8px">
      <div class="field"><label class="fl">${t('Invoice #')}</label><input class="in" id="inv-no"></div>
      <div class="field"><label class="fl">${t('Invoice date')}</label><input class="in" id="inv-date" type="date"></div>
      <div class="field"><label class="fl">${t('Amount')}</label><input class="in" id="inv-amount"></div>
      <div class="field"><label class="fl">${t('Vendor')}</label><input class="in" id="inv-vendor"></div>
    </div>
  </div></div>`;
}
window.qcSaveReviewedCerts=async ()=>{
  const P=_certPacket; if(!P||!P.detected.length) return;
  const st=$('rv-status'); const setSt=m=>{ if(st) st.textContent=m; };
  setSt(t('Saving…'));
  const invFiles=await uploadPending('invoice','invoices');
  const invoice={ no:gv('inv-no'), date:gv('inv-date'), amount:gv('inv-amount'), vendor:gv('inv-vendor'), file:invFiles[0]||null };
  const hasInv=invoice.no||invoice.date||invoice.amount||invoice.vendor||invoice.file;
  let n=0;
  for(const c of P.detected){
    try{
      const f=await buildCertFile(c, P.files);
      let fileObj=null;
      if(f){ const url=await upload(f,'certs'); if(url) fileObj={name:f.name,url,type:f.type||'application/octet-stream'}; }
      const id=newId('cert');
      await dbSet('qc/certs/'+id, { id, createdAt:Date.now()+n, addedBy:(QC_USER&&QC_USER.email)||'',
        material:c.material||'', spec:c.spec||'', heatLot:c.heat_lot||'', supplier:c.supplier||'', mill:c.mill||'', certNo:c.cert_no||'',
        certDate:c.cert_date||'', size:c.size_thickness||'', qty:c.qty||'', po:c.po_number||'', country:c.country_of_origin||'', itar:!!c.itar,
        files:fileObj?[fileObj]:[], file:fileObj, linkedOrders:c._linked||[], invoice: hasInv?invoice:null });
      n++; setSt(t('Saved')+' '+n+'/'+P.detected.length);
    }catch(e){ console.warn('save cert failed',e); }
  }
  _certPacket=null; _pendingFiles['cert']=[]; _pendingFiles['invoice']=[];
  editId=null; render();
};

// initial static translation (login screen + chrome) before sign-in
applyStatic();
</script>

<!-- ================= Firebase (auth + db + storage) ================= -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, update, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
const T=(s)=> (window.t? window.t(s): s);
const firebaseConfig = {
  apiKey: "AIzaSyBA2_PQBpNIwdBAzg-EPG-OAyqTtJAFOeg",
  authDomain: "bsmp-orders.firebaseapp.com",
  databaseURL: "https://bsmp-orders-default-rtdb.firebaseio.com",
  projectId: "bsmp-orders",
  storageBucket: "bsmp-orders.firebasestorage.app",
  messagingSenderId: "924947028289",
  appId: "1:924947028289:web:c58c74e37ee51aa1b9e9c0"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(()=>{});

const OPERATOR_EMAILS = ['operator@bertsmp.com'];
function isOperatorEmail(email){
  email=(email||'').toLowerCase();
  if(OPERATOR_EMAILS.includes(email)) return true;
  const local=email.split('@')[0]||'';
  return local.startsWith('operator');
}

window.qcSet = (path,val)=> set(ref(db,path), val);
window.qcUpdate = (path,val)=> update(ref(db,path), val);
window.qcRemove = (path)=> remove(ref(db,path));
window.qcUpload = async (file, prefix)=>{
  const safe=(file.name||'file').replace(/[^A-Za-z0-9._-]/g,'_');
  const path='qc/'+(prefix||'misc')+'/'+Date.now()+'_'+Math.floor(Math.random()*1e4)+'_'+safe;
  const task=uploadBytesResumable(sRef(storage,path), file, {contentType:file.type});
  await task;
  return await getDownloadURL(task.snapshot.ref);
};

function startListeners(){
  onValue(ref(db,'qc/inspections'), s=> window.qcOnData('inspections', s.val()||{}));
  onValue(ref(db,'qc/ncr'),         s=> window.qcOnData('ncr', s.val()||{}));
  onValue(ref(db,'qc/certs'),       s=> window.qcOnData('certs', s.val()||{}));
  onValue(ref(db,'orders'),         s=> window.qcOnData('orders', s.val()||{}));
  onValue(ref(db,'quotes'),         s=> window.qcOnData('quotes', s.val()||{}));
}
let _started=false;
onAuthStateChanged(auth, (user)=>{
  const ov=document.getElementById('qc-login');
  const fd=document.getElementById('qc-foot-dot'), ft=document.getElementById('qc-foot-txt');
  if(user){
    if(ov) ov.style.display='none';
    if(fd) fd.style.background='#1f7d57'; if(ft){ ft.removeAttribute('data-t'); ft.textContent=(user.email||'').split('@')[0]||'Signed in'; }
    if(!_started){ startListeners(); _started=true; }
    window.qcOnAuth(user, isOperatorEmail(user.email)?'operator':'manager');
  } else {
    if(ov) ov.style.display='flex';
    if(fd) fd.style.background='#8a93a0'; if(ft){ ft.setAttribute('data-t','Signed out'); ft.textContent=T('Signed out'); }
    window.qcOnAuth(null, 'manager');
  }
});
window._qcLogin = async ()=>{
  const email=(document.getElementById('qc-email').value||'').trim();
  const pass=document.getElementById('qc-pass').value;
  const err=document.getElementById('qc-login-err'), btn=document.getElementById('qc-login-btn');
  err.textContent=''; btn.disabled=true; btn.textContent=T('Signing in…');
  try{ await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ err.textContent=(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found')?T('Incorrect email or password.'):(T('Sign-in error: ')+e.message); }
  finally{ btn.disabled=false; btn.textContent=T('Sign in'); }
};
window._qcLogout = ()=> signOut(auth);
document.addEventListener('keydown', e=>{
  const ov=document.getElementById('qc-login');
  if(e.key==='Enter' && ov && ov.style.display!=='none' && document.activeElement && (document.activeElement.id==='qc-email'||document.activeElement.id==='qc-pass')) window._qcLogin();
});
</script>
</body>
