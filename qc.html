<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BSMP Inspection / QC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{
  --bg:#f5f2ea; --card:#ffffff; --surface:#ffffff;
  --text:#23262b; --text2:#5b6470; --text3:#8a93a0;
  --border:#e6e0d3; --border2:#d7d0c0;
  --accent:#3a4049; --accent-2:#23272e; --accent-soft:#eceef1; --spark:#d42b2b;
  --green:#1f7d57; --green-soft:#e7f1ec; --red:#a32d2d; --red-soft:#f7ebeb;
  --amber:#9a6212; --amber-soft:#f6efdf; --blue:#2c5d86;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --rail:64px; --sb:224px; --dock-h:64px; --radius:0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}

/* ===== Login ===== */
#qc-login{position:fixed;inset:0;background:var(--accent);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
#qc-login .card{background:#fff;padding:30px;width:340px;max-width:94vw;box-shadow:0 12px 48px rgba(0,0,0,.3)}
#qc-login .ttl{font-size:18px;font-weight:800;text-align:center}
#qc-login .sub{font-size:12px;color:var(--text2);text-align:center;margin:4px 0 18px}
#qc-login input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border2);background:#fff;outline:none;margin-bottom:10px}
#qc-login input:focus{border-color:var(--accent)}
#qc-login .err{font-size:12px;color:var(--red);min-height:15px;margin-bottom:6px}
#qc-login button{width:100%;height:40px;font-weight:700;color:#fff;background:var(--accent);border:none;cursor:pointer}
#qc-login button:hover{background:var(--accent-2)}
#qc-login .lang{display:flex;justify-content:center;gap:0;margin-top:14px}
#qc-login .lang button{width:auto;height:26px;padding:0 12px;background:#fff;color:var(--text3);border:1px solid var(--border);border-right:none;font-size:11px;font-weight:800}
#qc-login .lang button:last-child{border-right:1px solid var(--border)}
#qc-login .lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== Shell ===== */
#qc-app{display:none;min-height:100vh;width:100%}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--accent);display:flex;flex-direction:column;overflow:hidden;z-index:48;transition:width .18s ease}
.sidebar:hover,body.sb-pinned .sidebar{width:var(--sb)}
.sb-logo{background:var(--accent);padding:14px 14px 12px;border-bottom:2.25px solid var(--spark);min-height:64px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.sb-logo img{max-width:188px;max-height:54px;width:auto;height:auto;object-fit:contain;display:block}
.sb-pin{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.12);border:none;color:#fff;width:26px;height:26px;cursor:pointer;display:none;align-items:center;justify-content:center}
.sidebar:hover .sb-pin,body.sb-pinned .sb-pin{display:flex}
.nav{padding:10px 0;flex:1;overflow-y:auto}
.nav-sec{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:14px 0 6px 20px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;padding:0 20px;height:42px;color:rgba(255,255,255,.82);cursor:pointer;white-space:nowrap;font-weight:600;border-left:3px solid transparent}
.nav-item i{font-size:20px;flex:none;width:20px;text-align:center}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.10);color:#fff;border-left-color:var(--spark)}
.nav-label{opacity:0;transition:opacity .12s}
.sidebar:hover .nav-label,body.sb-pinned .nav-label{opacity:1}
.sb-foot{padding:10px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:rgba(255,255,255,.6);white-space:nowrap;display:flex;align-items:center;gap:8px}
.sb-foot .dot{width:8px;height:8px;border-radius:50%;background:#8a93a0;flex:none}

main{margin-left:var(--rail);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .18s ease}
body.sb-pinned main{margin-left:var(--sb)}
.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:20px}
.topbar .sub{font-size:12px;color:var(--text2)}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 11px;border:1px solid var(--border);background:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#8a93a0}
#qc-lang{display:inline-flex;border:1px solid var(--border)}
#qc-lang button{height:30px;padding:0 10px;background:#fff;border:none;border-right:1px solid var(--border);font-weight:800;font-size:11px;color:var(--text3);cursor:pointer}
#qc-lang button:last-child{border-right:none}
#qc-lang button.on{background:var(--accent);color:#fff}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;color:var(--text2);cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.content{flex:1;padding:22px 22px calc(26px + var(--dock-h));max-width:1100px;width:100%}

/* ===== Dock ===== */
.dock{position:fixed;left:var(--rail);right:0;bottom:0;height:var(--dock-h);background:var(--card);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(16,24,40,.06);display:flex;align-items:stretch;padding-left:8px;z-index:46;transition:left .18s ease}
body.sb-pinned .dock{left:var(--sb)}
.dock-tab{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text2);font-size:10.5px;font-weight:700;background:none;border:none;border-top:2.25px solid transparent;font-family:inherit;text-align:center}
.dock-tab i{font-size:19px}
.dock-tab.active{color:var(--accent);background:var(--accent-soft);border-top-color:var(--spark)}
.dock-tab:hover{color:var(--accent)}
.dock-switch{display:flex;align-items:center;gap:10px;padding-left:16px;margin-left:8px;border-left:1px solid var(--border)}
.dock-switch .lbl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.dock-chips{display:flex;gap:7px}
.dock-chip{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.92}
.dock-chip:hover{opacity:1}
.dock-chip.cur{outline:2px solid #fff;outline-offset:-2px;box-shadow:0 0 0 2px var(--accent)}
.dock-chip i{font-size:17px}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--border2);background:#fff;color:var(--text);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn i{font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:#e7c9c9}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.page-head{margin-bottom:16px}
.page-head h2{font-size:18px}
.page-head p{margin:3px 0 0;font-size:12.5px;color:var(--text2)}
.muted{color:var(--text3)}
.empty{padding:34px 16px;text-align:center;color:var(--text3);font-size:13px}

label.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text2);margin:0 0 5px}
.field{margin-bottom:13px}
.in,select.in,textarea.in{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--border2);background:#fff;outline:none}
.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent)}
textarea.in{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--text3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--border)}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--accent-soft)}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border:1px solid transparent;white-space:nowrap}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.flag{background:var(--red-soft);color:var(--red)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.neutral{background:var(--accent-soft);color:var(--text2)}

.char-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.char-tbl th{font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--text3);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--border);text-align:left}
.char-tbl td{padding:4px 5px;border-bottom:1px solid var(--border);vertical-align:top}
.char-tbl input,.char-tbl textarea{width:100%;border:1px solid var(--border);background:#fff;padding:6px 7px;outline:none;min-height:32px}
.char-tbl input:focus,.char-tbl textarea:focus{border-color:var(--accent)}
.char-tbl .cno{width:48px;text-align:center;font-weight:700;color:var(--text2)}
.char-tbl .rm{color:var(--text3);cursor:pointer;text-align:center}
.char-tbl .rm:hover{color:var(--red)}
.char-tbl tr.oot td{background:var(--red-soft)}

.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{width:84px;height:84px;border:1px solid var(--border);object-fit:cover;background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--border2)}
.seg button{height:36px;padding:0 14px;background:#fff;border:none;border-right:1px solid var(--border2);cursor:pointer;font-weight:700;color:var(--text2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.res-pick{display:flex;gap:10px}
.res-pick .opt{flex:1;border:1px solid var(--border2);padding:14px;text-align:center;cursor:pointer;font-weight:800}
.res-pick .opt.pass.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.res-pick .opt.flag.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.hint{font-size:12px;color:var(--text3);margin-top:4px}
.aiwip{font-size:11.5px;color:var(--text3);border:1px dashed var(--border2);padding:9px 11px;margin-top:8px;display:flex;align-items:center;gap:8px}
body.role-operator .mgr-only{display:none!important}
</style>
</head>
<body>

<!-- ===== Login gate ===== -->
<div id="qc-login">
  <div class="card">
    <div class="ttl"><span style="color:var(--accent)">BSMP</span> Inspection / QC</div>
    <div class="sub" data-t="Sign in to continue">Sign in to continue</div>
    <input id="qc-email" type="email" data-tph="Email" placeholder="Email" autocomplete="username">
    <input id="qc-pass" type="password" data-tph="Password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="qc-login-err"></div>
    <button id="qc-login-btn" data-t="Sign in" onclick="window._qcLogin()">Sign in</button>
    <div class="lang" id="qc-lang-login">
      <button data-lang="en" onclick="qcSetLang('en')">EN</button>
      <button data-lang="es" onclick="qcSetLang('es')">ES</button>
    </div>
  </div>
</div>

<!-- ===== App ===== -->
<div id="qc-app">
  <nav class="sidebar" id="qc-sidebar">

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDate(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleDateString(LANG==='es'?'es-MX':'en-US',{month:'short',day:'numeric',year:'2-digit'}); }
function fmtWhen(ms){ if(!ms) return '—'; return new Date(ms).toLocaleString(LANG==='es'?'es-MX':'en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function gv(id){const el=$(id);return el?el.value.trim():'';}
function gc(id){const el=$(id);return el?el.checked:false;}

/* ---------- data in from Firebase module ---------- */
window.qcOnData=(name,val)=>{
  if(name==='inspections') INSPECTIONS=val||{};
  else if(name==='ncr') NCRS=val||{};
  else if(name==='certs') CERTS=val||{};
  else if(name==='orders') ORDERS=val||{};
  else if(name==='quotes') QUOTES=val||{};
  render();
};
window.qcOnAuth=(user,role)=>{
  QC_USER=user; QC_ROLE=role||'manager';
  document.body.classList.toggle('role-operator', role==='operator');
  const chip=$('qc-role-chip'), rt=$('qc-role-txt');
  if(chip){ chip.style.display='inline-flex'; rt.textContent=t(role==='operator'?'Operator':'Manager'); chip.querySelector('i').className=role==='operator'?'ti ti-user-cog':'ti ti-shield-check'; }

  if(page==='inspections' && role==='operator') page='selfcheck';

async function dbSet(path,val){ if(window.qcSet) return window.qcSet(path,val); }
async function dbRemove(path){ if(window.qcRemove) return window.qcRemove(path); }

/* ---------- routing ---------- */
const META={
  inspections:['Inspections','Operator self-checks and first articles'],
  selfcheck:['Self-Check','Confirm your work before sign-off'],
  fairs:['First Articles','Formal first-article reports'],

window.showPage=(p)=>{
  if(QC_ROLE==='operator' && p==='certs') p='inspections';

};
function setActive(){
  const navMap={selfcheck:'nav-selfcheck',inspections:'nav-inspections',fairs:'nav-fairs',fair:'nav-fairs',ncr:'nav-ncr',certs:'nav-certs'};
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(navMap[page]&&$(navMap[page])) $(navMap[page]).classList.add('active');
  const dockMap={selfcheck:'dock-selfcheck',inspections:'dock-inspections',fairs:'dock-fairs',fair:'dock-fairs',ncr:'dock-ncr'};
  document.querySelectorAll('.dock-tab').forEach(tb=>tb.classList.remove('active'));
  if(dockMap[page]&&$(dockMap[page])) $(dockMap[page]).classList.add('active');
  const m=META[page]||['Inspections','Quality control'];
  $('tb-title').textContent=t(m[0]); $('tb-sub').textContent=t(m[1]);
}
function render(){
  if(!QC_USER && !window.__qcDemo) return;
  setActive();
  const c=$('content'); if(!c) return;
  if(page==='inspections') c.innerHTML=viewInspections();
  else if(page==='selfcheck') c.innerHTML=viewSelfCheck();
  else if(page==='fairs') c.innerHTML=viewFairs();
  else if(page==='fair') c.innerHTML=viewFair();
  else if(page==='ncr') c.innerHTML=viewNcr();
  else if(page==='certs') c.innerHTML=viewCerts();
}

/* ---------- order linking ---------- */
function orderOptions(sel){
  const list=vals(ORDERS).sort((a,b)=>(b.ordered||'').localeCompare(a.ordered||''));
  return `<option value="">${t('— Not linked / free entry —')}</option>`+list.map(o=>{
    const lbl=[o.customer,o.part||o.partNum,o.job?('Job '+o.job):'',o.po?('PO '+o.po):''].filter(Boolean).join(' · ');
    return `<option value="${esc(o.id)}" ${sel===o.id?'selected':''}>${esc(lbl||o.id)}</option>`;
  }).join('');
}
window.qcFillFromOrder=(prefix,oid)=>{
  const o=ORDERS[oid]; if(!o) return;
  const set=(suf,v)=>{const el=$(prefix+suf); if(el&&v!=null) el.value=v;};
  set('-customer',o.customer||''); set('-part',o.part||o.partNum||''); set('-po',o.po||''); set('-job',o.job||'');
};

/* ---------- file inputs ---------- */
window.qcPickFiles=(key,inputEl)=>{
  _pendingFiles[key]=_pendingFiles[key]||[];
  [...inputEl.files].forEach(f=>_pendingFiles[key].push(f));
  const strip=$('files-'+key);
  if(strip) strip.innerHTML=(_pendingFiles[key]||[]).map(f=>`<span class="badge neutral"><i class="ti ti-paperclip"></i> ${esc(f.name)}</span>`).join(' ');
  inputEl.value='';
};
async function uploadPending(key,prefix){
  const files=_pendingFiles[key]||[]; const urls=[];
  for(const f of files){ try{ const u=await upload(f,prefix); if(u) urls.push({name:f.name,url:u,type:f.type}); }catch(e){ console.warn('upload failed',e); } }
  _pendingFiles[key]=[];
  return urls;
}

/* =================== INSPECTIONS LIST =================== */
function resultBadge(r){
  if(r==='Pass') return `<span class="badge ok"><i class="ti ti-check"></i> ${t('Pass')}</span>`;
  if(r==='Flag') return `<span class="badge flag"><i class="ti ti-flag"></i> ${t('Flagged')}</span>`;
  return '<span class="badge neutral">—</span>';
}
function fairStatusBadge(s){
  const map={Draft:'neutral',Measuring:'warn',Submitted:'warn',Approved:'ok',Rejected:'flag'};
  return `<span class="badge ${map[s]||'neutral'}">${t(s||'Draft')}</span>`;
}
function viewInspections(){
  const list=vals(INSPECTIONS).filter(i=>i.type==='self').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const rows=list.map(i=>`<tr class="click" onclick="window.qcOpenSelf('${i.id}')">
    <td><b>${esc(i.partNum||'—')}</b><div class="muted" style="font-size:12px">${esc(i.customer||'')}</div></td>
    <td>${esc(i.job||'—')}${i.po?` <span class="muted">· ${t('PO #')} ${esc(i.po)}</span>`:''}</td>
    <td>${esc(i.qty||'')}</td>
    <td>${resultBadge(i.result)}</td>
    <td>${esc((i.createdBy||'').split('@')[0])}<div class="muted" style="font-size:12px">${fmtWhen(i.createdAt)}</div></td>
  </tr>`).join('');
  return `<div class="page-head"><h2>${t('Inspections')}</h2><p>${t('Operator self-checks. Flag a part to raise a nonconformance.')}</p></div>
    <div class="toolbar"><button class="btn primary" onclick="showPage('selfcheck')"><i class="ti ti-camera-check"></i> ${t('New self-check')}</button></div>
    <div class="card" style="padding:0">
      ${list.length?`<table class="tbl"><thead><tr><th>${t('Part')}</th><th>${t('Job / PO')}</th><th>${t('Qty')}</th><th>${t('Result')}</th><th>${t('By')}</th></tr></thead><tbody>${rows}</tbody></table>`
        :`<div class="empty">${t('No self-checks yet. Press')} <b>${t('New self-check')}</b> ${t('to log one.')}</div>`}
    </div>`;
}
window.qcOpenSelf=(id)=>{ editId=id; page='selfcheck'; render(); };

/* =================== SELF-CHECK FORM =================== */

  const result=v('result','');
  return `<div class="page-head"><h2>${r?t('Self-check'):t('New self-check')}</h2><p>${t('Snap a photo, confirm your work, then mark Pass or Flag.')}</p></div>
  <div class="card">
    <div class="field"><label class="fl">${t('Link to an order')}</label>
      <select class="in" id="sc-order" onchange="qcFillFromOrder('sc',this.value)">${orderOptions(v('orderId',''))}</select>

    </div>
    <div class="grid2">
      <div class="field"><label class="fl">${t('Part #')}</label><input class="in" id="sc-part" value="${esc(v('partNum'))}"></div>
      <div class="field"><label class="fl">${t('Customer')}</label><input class="in" id="sc-customer" value="${esc(v('customer'))}"></div>
      <div class="field"><label class="fl">${t('Job #')}</label><input class="in" id="sc-job" value="${esc(v('job'))}"></div>
      <div class="field"><label class="fl">${t('PO #')}</label><input class="in" id="sc-po" value="${esc(v('po'))}"></div>
      <div class="field"><label class="fl">${t('Qty inspected')}</label><input class="in" id="sc-qty" type="number" min="0" value="${esc(v('qty'))}"></div>
      <div class="field"><label class="fl">${t('Rev')}</label><input class="in" id="sc-rev" value="${esc(v('rev'))}"></div>
    </div>
    <div class="field"><label class="fl">${t('Part photo(s)')}</label>
      <label class="btn sm"><i class="ti ti-camera"></i> ${t('Add photo')}<input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="qcPickFiles('sc',this)"></label>
      <div class="thumbs" id="files-sc"></div>
      ${(r&&r.photos&&r.photos.length)?`<div class="thumbs">${r.photos.map(p=>`<img class="thumb" src="${esc(p.url)}">`).join('')}</div>`:''}
      <div class="aiwip"><i class="ti ti-sparkles"></i> ${t('AI photo check (compare to a known-good reference + flag obvious mistakes) is coming next. For now this saves the photo; you still verify toleranced features with a gauge.')}</div>
    </div>
    <div class="field"><label class="fl">${t('Result')}</label>
      <div class="res-pick">
        <div class="opt pass ${result==='Pass'?'on':''}" id="sc-pass" onclick="qcPickResult('Pass')"><i class="ti ti-check"></i> ${t('Pass')}</div>
        <div class="opt flag ${result==='Flag'?'on':''}" id="sc-flag" onclick="qcPickResult('Flag')"><i class="ti ti-flag"></i> ${t('Flag (raise NCR)')}</div>
      </div>
      <input type="hidden" id="sc-result" value="${esc(result)}">
    </div>
    <div class="field" id="sc-flag-note" style="display:${result==='Flag'?'block':'none'}"><label class="fl">${t('What\u2019s wrong? (starts a nonconformance)')}</label><textarea class="in" id="sc-issue">${esc(v('issue'))}</textarea></div>
    <div class="field"><label class="fl">${t('Notes')}</label><textarea class="in" id="sc-notes">${esc(v('notes'))}</textarea></div>
    <div class="toolbar" style="margin:4px 0 0">
      <button class="btn primary" onclick="window.qcSaveSelf()"><i class="ti ti-device-floppy"></i> ${t('Save self-check')}</button>
      <button class="btn" onclick="showPage('inspections')">${t('Cancel')}</button>
    </div>
  </div>`;
}
window.qcPickResult=(r)=>{ $('sc-result').value=r; $('sc-pass').classList.toggle('on',r==='Pass'); $('sc-flag').classList.toggle('on',r==='Flag'); $('sc-flag-note').style.display=r==='Flag'?'block':'none'; };
window.qcSaveSelf=async ()=>{
  const part=gv('sc-part'), cust=gv('sc-customer');
  if(!part&&!cust){ alert(t('Enter at least a part # or customer.')); return; }
  const result=gv('sc-result');
  if(!result){ alert(t('Mark the result as Pass or Flag.')); return; }
  const id=editId||newId('insp');
  const prev=editId?INSPECTIONS[editId]:null;
  const photos=(prev&&prev.photos)?prev.photos.slice():[];
  const fresh=await uploadPending('sc','inspections');
  fresh.forEach(f=>photos.push(f));
  const rec={
    id, type:'self', createdAt:(prev&&prev.createdAt)||Date.now(), createdBy:(prev&&prev.createdBy)||(QC_USER&&QC_USER.email)||'',
    updatedAt:Date.now(), orderId:gv('sc-order'),
    partNum:part, customer:cust, rev:gv('sc-rev'), po:gv('sc-po'), job:gv('sc-job'), qty:gv('sc-qty'),
    result, status: result==='Pass'?'Logged':'Flagged', issue:gv('sc-issue'), notes:gv('sc-notes'), photos
  };
  await dbSet('qc/inspections/'+id, rec);
  if(result==='Flag' && !(prev&&prev.ncrId)){
    const ncrId=newId('ncr');
    const ncr={ id:ncrId, createdAt:Date.now(), raisedBy:(QC_USER&&QC_USER.email)||'', status:'open',
      inspectionId:id, orderId:rec.orderId, partNum:part, customer:cust, job:rec.job, qtyAffected:rec.qty,
      description:rec.issue||'Flagged during operator self-check.', disposition:'', correctiveAction:'' };
    await dbSet('qc/ncr/'+ncrId, ncr);
    rec.ncrId=ncrId; await dbSet('qc/inspections/'+id, rec);
  }
  editId=null; page='inspections'; render();
};

  email=(email||'').toLowerCase();
  if(OPERATOR_EMAILS.includes(email)) return true;
  const local=email.split('@')[0]||'';
  return local.startsWith('operator');
}

window.qcSet = (path,val)=> set(ref(db,path), val);
window.qcUpdate = (path,val)=> update(ref(db,path), val);
window.qcRemove = (path)=> remove(ref(db,path));
window.qcUpload = async (file, prefix)=>{
  const safe=(file.name||'file').replace(/[^A-Za-z0-9._-]/g,'_');
  const path='qc/'+(prefix||'misc')+'/'+Date.now()+'_'+Math.floor(Math.random()*1e4)+'_'+safe;
  const task=uploadBytesResumable(sRef(storage,path), file, {contentType:file.type});
  await task;
  return await getDownloadURL(task.snapshot.ref);
};

function startListeners(){
  onValue(ref(db,'qc/inspections'), s=> window.qcOnData('inspections', s.val()||{}));
  onValue(ref(db,'qc/ncr'),         s=> window.qcOnData('ncr', s.val()||{}));
  onValue(ref(db,'qc/certs'),       s=> window.qcOnData('certs', s.val()||{}));
  onValue(ref(db,'orders'),         s=> window.qcOnData('orders', s.val()||{}));
  onValue(ref(db,'quotes'),         s=> window.qcOnData('quotes', s.val()||{}));
}
let _started=false;
onAuthStateChanged(auth, (user)=>{
  const ov=document.getElementById('qc-login');
  const fd=document.getElementById('qc-foot-dot'), ft=document.getElementById('qc-foot-txt');
  if(user){
    if(ov) ov.style.display='none';
    if(fd) fd.style.background='#1f7d57'; if(ft){ ft.removeAttribute('data-t'); ft.textContent=(user.email||'').split('@')[0]||'Signed in'; }
    if(!_started){ startListeners(); _started=true; }
    window.qcOnAuth(user, isOperatorEmail(user.email)?'operator':'manager');
  } else {
    if(ov) ov.style.display='flex';
    if(fd) fd.style.background='#8a93a0'; if(ft){ ft.setAttribute('data-t','Signed out'); ft.textContent=T('Signed out'); }
    window.qcOnAuth(null, 'manager');
  }
});
window._qcLogin = async ()=>{
  const email=(document.getElementById('qc-email').value||'').trim();
  const pass=document.getElementById('qc-pass').value;
  const err=document.getElementById('qc-login-err'), btn=document.getElementById('qc-login-btn');
  err.textContent=''; btn.disabled=true; btn.textContent=T('Signing in…');
  try{ await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ err.textContent=(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found')?T('Incorrect email or password.'):(T('Sign-in error: ')+e.message); }
  finally{ btn.disabled=false; btn.textContent=T('Sign in'); }
};
window._qcLogout = ()=> signOut(auth);
document.addEventListener('keydown', e=>{
  const ov=document.getElementById('qc-login');
  if(e.key==='Enter' && ov && ov.style.display!=='none' && document.activeElement && (document.activeElement.id==='qc-email'||document.activeElement.id==='qc-pass')) window._qcLogin();
});
</script>
