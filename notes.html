<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BSMP Notes</title>
<!-- iOS "Add to Home Screen" behaves like an app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BSMP Notes">
<meta name="theme-color" content="#43397a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2343397a'/><g stroke='white' stroke-width='2' stroke-linecap='round'><line x1='9' y1='11' x2='23' y2='11'/><line x1='9' y1='16' x2='23' y2='16'/><line x1='9' y1='21' x2='18' y2='21'/></g></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='34' fill='%2343397a'/><g stroke='white' stroke-width='11' stroke-linecap='round'><line x1='50' y1='62' x2='130' y2='62'/><line x1='50' y1='90' x2='130' y2='90'/><line x1='50' y1='118' x2='104' y2='118'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{
  --bg:#f5f2ea; --card:#ffffff; --surface:#ffffff;
  --text:#23262b; --text2:#5b6470; --text3:#8a93a0;
  --border:#e6e0d3; --border2:#d7d0c0;
  --accent:#43397a; --accent-2:#332b60; --accent-soft:#ecebf5; --spark:#d42b2b;
  --green:#1f7d57; --green-soft:#e7f1ec; --red:#a32d2d; --red-soft:#f7ebeb;
  --amber:#9a6212; --amber-soft:#f6efdf; --blue:#2c5d86;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --rail:64px; --sb:224px; --dock-h:64px; --radius:0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em}

/* ===== Login ===== */
#nt-login{position:fixed;inset:0;background:var(--accent);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
#nt-login .card{background:#fff;padding:30px;width:340px;max-width:94vw;box-shadow:0 12px 48px rgba(0,0,0,.3)}
#nt-login .ttl{font-size:18px;font-weight:800;text-align:center}
#nt-login .sub{font-size:12px;color:var(--text2);text-align:center;margin:4px 0 18px}
#nt-login input{width:100%;height:40px;padding:0 12px;border:1px solid var(--border2);background:#fff;outline:none;margin-bottom:10px}
#nt-login input:focus{border-color:var(--accent)}
#nt-login .err{font-size:12px;color:var(--red);min-height:15px;margin-bottom:6px}
#nt-login button{width:100%;height:40px;font-weight:700;color:#fff;background:var(--accent);border:none;cursor:pointer}
#nt-login button:hover{background:var(--accent-2)}

/* ===== Shell ===== */
#nt-app{display:none;min-height:100vh;width:100%}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--accent);display:flex;flex-direction:column;overflow:hidden;white-space:nowrap;z-index:48;transition:width .18s ease,box-shadow .18s ease;--label-op:0}
.sidebar:hover{width:var(--sb);--label-op:1;box-shadow:6px 0 28px rgba(0,0,0,.30)}
body.sb-pinned .sidebar{width:var(--sb);--label-op:1}
.logo-flag{position:fixed;left:0;top:0;z-index:50;width:var(--sb);height:84px;display:flex;align-items:center;padding:0 18px;background:var(--accent);box-shadow:4px 5px 16px rgba(0,0,0,.24);border-bottom:2.25px solid var(--spark)}
.wordmark{color:#fff;font-weight:800;font-size:21px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:7px}
.wordmark span{font-weight:600;font-size:14px;color:rgba(255,255,255,.6)}
.sidebar-top{height:84px;border-bottom:2.25px solid var(--spark);flex-shrink:0}
.nav{padding:8px 0;flex:1;overflow-y:auto;overflow-x:hidden}
.nav-sec{padding:14px 18px 6px;font-size:9px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.30);opacity:var(--label-op);transition:opacity .15s;white-space:nowrap}
.nav-item{position:relative;display:flex;align-items:center;gap:13px;padding:9px 20px;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);cursor:pointer}
.nav-item i{font-size:18px;flex:none;width:18px;text-align:center;opacity:.9}
.nav-item .nav-label{opacity:var(--label-op);transition:opacity .15s}
.nav-item:hover{color:rgba(255,255,255,.92);background:rgba(255,255,255,.05)}
.nav-item.active{color:#fff;background:rgba(255,255,255,.08)}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--spark)}
.sb-foot{height:46px;border-top:1px solid rgba(255,255,255,.10);display:flex;align-items:center;gap:10px;padding:0 20px;flex-shrink:0}
.sb-foot .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none}
.sb-foot .lbl{font-size:11.5px;color:rgba(255,255,255,.6);opacity:var(--label-op);transition:opacity .15s;white-space:nowrap;overflow:hidden}
.pin-btn{margin-left:auto;flex-shrink:0;width:26px;height:26px;border:none;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:var(--label-op);transition:opacity .15s}
body.sb-pinned .pin-btn{background:var(--spark)}
.pin-btn i{font-size:15px}
main{margin-left:var(--rail);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .18s ease}
body.sb-pinned main{margin-left:var(--sb)}
.topbar{height:84px;background:var(--card);border-bottom:2.25px solid var(--spark);display:flex;align-items:center;gap:12px;padding:0 22px;padding-left:170px;position:sticky;top:0;z-index:30;transition:padding-left .18s ease}
body.sb-pinned .topbar{padding-left:22px}
.topbar h1{font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.topbar .sub{font-size:12px;color:var(--text2)}
.topbar .sp{flex:1}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;color:var(--text2);cursor:pointer}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.content{flex:1;padding:22px 22px calc(26px + var(--dock-h));max-width:1500px;width:100%}

/* ===== Dock ===== */
.dock{position:fixed;left:var(--rail);right:0;bottom:0;height:var(--dock-h);background:var(--card);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(16,24,40,.06);display:flex;align-items:stretch;padding-left:8px;z-index:46;transition:left .18s ease;overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
body.sb-pinned .dock{left:var(--sb)}
.dock-tab{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text2);font-size:10.5px;font-weight:700;background:none;border:none;border-top:2.25px solid transparent;font-family:inherit;text-align:center}
.dock-tab i{font-size:19px}
.dock-tab.active{color:var(--accent);background:var(--accent-soft);border-top-color:var(--spark)}
.dock-tab:hover{color:var(--accent)}
.dock-switch{display:flex;align-items:center;gap:10px;padding-left:16px;margin-left:8px;border-left:1px solid var(--border)}
.dock-switch .lbl{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.dock-chips{display:flex;gap:7px}
.dock-chip{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;opacity:.92}
.dock-chip:hover{opacity:1}
.dock-chip.cur{outline:2px solid #fff;outline-offset:-2px;box-shadow:0 0 0 2px var(--accent)}
.dock-chip i{font-size:17px}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--border2);background:#fff;color:var(--text);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn i{font-size:17px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--red);border-color:#e7c9c9}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--text3)}
.empty{padding:34px 16px;text-align:center;color:var(--text3);font-size:13px}
label.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text2);margin:0 0 5px}
.field{margin-bottom:13px}
.in,select.in,textarea.in{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--border2);background:#fff;outline:none}
.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:680px){.grid2{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--text3);margin-top:4px}
.thumbs{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.thumb{width:84px;height:84px;border:1px solid var(--border);object-fit:cover;background:var(--accent-soft)}
@keyframes ntspin{to{transform:rotate(360deg)}}
.ti.spin{display:inline-block;animation:ntspin .8s linear infinite}

/* ===== Notes-specific ===== */
.search-wrap{position:relative;display:flex;align-items:center;flex:1;min-width:180px}
.search-wrap i{position:absolute;left:10px;color:var(--text3);font-size:16px;pointer-events:none}
.search-wrap input{padding-left:32px}
.tagfilter{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tf{font-size:12px;font-weight:700;padding:4px 10px;border:1px solid var(--border2);background:#fff;color:var(--text2);cursor:pointer}
.tf.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.note-card{position:relative;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);padding:14px 14px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:96px}
.note-card:hover{border-color:var(--accent)}
.note-pin{position:absolute;top:8px;right:8px;border:none;background:none;color:var(--text3);cursor:pointer;font-size:16px;padding:2px;line-height:1}
.note-pin.on{color:var(--accent)}
.note-title{font-weight:800;font-size:14px;padding-right:22px}
.note-snippet{font-size:12.5px;color:var(--text2);line-height:1.4;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.note-meta{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px}
.note-tags{display:flex;gap:5px;flex-wrap:wrap}
.tagchip{font-size:11px;font-weight:700;padding:2px 8px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tagchip i{cursor:pointer}
.note-foot{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:11px;color:var(--text2);flex-wrap:wrap}
.note-foot span{display:inline-flex;align-items:center;gap:4px}
.note-titlein{font-size:18px;font-weight:800;border:none;padding:6px 2px;margin-bottom:6px}
.note-titlein:focus{border-color:transparent}
.rt-toolbar{display:flex;gap:2px;align-items:center;border:1px solid var(--border2);border-bottom:none;padding:4px 6px;background:var(--bg);flex-wrap:wrap}
.rt-toolbar button{border:1px solid transparent;background:none;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--text2);min-width:32px;height:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.rt-toolbar button:hover{background:#fff;border-color:var(--border);color:var(--accent)}
.rt-div{width:1px;height:18px;background:var(--border2);margin:0 5px}
.rt-body{border:1px solid var(--border2);min-height:150px;max-height:52vh;overflow:auto;padding:11px;line-height:1.5;outline:none}
.rt-body:focus{border-color:var(--accent)}
.rt-body h2{font-size:19px;margin:6px 0}
.rt-body h3{font-size:16px;margin:6px 0}
.rt-body p{margin:5px 0}
.rt-body ul{margin:5px 0;padding-left:22px}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.check-row input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.check-text{flex:1;min-height:34px}
.check-rm{border:none;background:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px;line-height:1}
.check-rm:hover{color:var(--red)}
.photos-head{cursor:pointer;user-select:none;margin-bottom:10px}
.thumb-wrap{position:relative;display:inline-block}
.thumb-x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:none;background:var(--red);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px}
.thumb-pending{width:auto;height:84px;display:inline-flex;align-items:center;gap:5px;padding:0 12px;font-size:11px;color:var(--text2);border:1px dashed var(--border2)}
.nt-toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 18px);transform:translateX(-50%) translateY(8px);background:var(--accent);color:#fff;padding:11px 18px;font-weight:700;font-size:13px;z-index:9600;box-shadow:0 10px 28px rgba(0,0,0,.28);display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw}
.nt-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.nt-toast.err{background:var(--spark)}
.nt-toast.ok{background:#2f7d55}
</style>
</head>
<body>

<!-- ===== Login gate ===== -->
<div id="nt-login">
  <div class="card">
    <div class="ttl"><span style="color:var(--accent)">BSMP</span> Notes</div>
    <div class="sub">Sign in to continue</div>
    <input id="nt-email" type="email" placeholder="Email" autocomplete="username">
    <input id="nt-pass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="nt-login-err"></div>
    <button id="nt-login-btn" onclick="window._ntLogin()">Sign in</button>
  </div>
</div>

<!-- ===== App ===== -->
<div id="nt-app">
  <div class="logo-flag"><div class="wordmark">BSMP<span>Notes</span></div></div>
  <nav class="sidebar" id="nt-sidebar">
    <div class="sidebar-top"></div>
    <div class="nav">
      <div class="nav-sec">Notes</div>
      <div class="nav-item" id="nav-all" onclick="showNtPage('all')"><i class="ti ti-notes"></i><span class="nav-label">All Notes</span></div>
      <div class="nav-item" id="nav-pinned" onclick="showNtPage('pinned')"><i class="ti ti-pin"></i><span class="nav-label">Pinned</span></div>
      <div class="nav-item" onclick="ntNew()"><i class="ti ti-plus"></i><span class="nav-label">New Note</span></div>
    </div>
    <div class="sb-foot"><span class="dot" id="nt-foot-dot"></span><span class="lbl" id="nt-foot-txt">Connecting…</span><button class="pin-btn" id="nt-pin" title="Keep menu open" onclick="window._ntPin(event)"><i class="ti ti-pin" id="nt-pin-ico"></i></button></div>
  </nav>

  <main>
    <header class="topbar">
      <div>
        <h1 id="tb-title">Notes</h1>
        <div class="sub" id="tb-sub">Your private notes</div>
      </div>
      <span class="sp"></span>
      <button class="icon-btn" id="nt-signout" title="Sign out" onclick="window._ntLogout()"><i class="ti ti-logout"></i></button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- ===== Dock ===== -->
<div class="dock" id="nt-dock" style="display:none">
  <button class="dock-tab" id="dock-all" onclick="showNtPage('all')"><i class="ti ti-notes"></i><span>All</span></button>
  <button class="dock-tab" id="dock-pinned" onclick="showNtPage('pinned')"><i class="ti ti-pin"></i><span>Pinned</span></button>
  <button class="dock-tab" onclick="ntNew()"><i class="ti ti-plus"></i><span>New</span></button>
  <div class="dock-switch">
    <span class="lbl">Switch app</span>
    <div class="dock-chips">
      <a class="dock-chip" title="Quote" href="quote.html" style="background:#1e3a5f"><i class="ti ti-file-invoice"></i></a>
      <a class="dock-chip" title="Orders" href="orders.html" style="background:#6a1f2e"><i class="ti ti-clipboard-list"></i></a>
      <a class="dock-chip" title="AP / AR" href="apar.html" style="background:#1f4d38"><i class="ti ti-cash"></i></a>
      <a class="dock-chip" title="Inspection / QC" href="qc.html" style="background:#3a4049"><i class="ti ti-ruler-measure"></i></a>
      <span class="dock-chip cur" title="Notes" style="background:#43397a"><i class="ti ti-notes"></i></span>
    </div>
  </div>
</div>

<!-- ================= UI logic (classic) ================= -->
<script>
/* ---------- state ---------- */
window.NT_USER=null; window.NT_UID=null;
let NOTES={}, ORDERS={};
let page='list';       // 'list' | 'edit'
let editId=null;
let filterTag='', pinnedOnly=false;
let _editChecklist=[], _editTags=[], _editPhotos=[], _pendingPhotos=[], _editPinned=false, _photosCollapsed=true;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vals=o=>Object.values(o||{}).filter(Boolean);
const newId=p=>(p||'r')+'_'+Date.now().toString(36)+Math.floor(Math.random()*1000);
const jsSafe=s=>String(s==null?'':s).replace(/["'\\]/g,'');
function gv(id){const el=$(id);return el?el.value.trim():'';}
function fmtWhen(ms){ if(!ms) return ''; return new Date(ms).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function stripHtml(html){ const d=document.createElement('div'); d.innerHTML=String(html||''); return d.textContent||d.innerText||''; }
function stripDangerous(html){
  return String(html||'')
    .replace(/<\s*script[\s\S]*?<\s*\/\s*script\s*>/gi,'')
    .replace(/<\s*style[\s\S]*?<\s*\/\s*style\s*>/gi,'')
    .replace(/ on\w+\s*=\s*"[^"]*"/gi,'')
    .replace(/ on\w+\s*=\s*'[^']*'/gi,'')
    .replace(/javascript:/gi,'');
}
function ntToast(msg,kind){
  let el=$('nt-toast');
  if(!el){ el=document.createElement('div'); el.id='nt-toast'; el.className='nt-toast'; document.body.appendChild(el); }
  el.className='nt-toast '+(kind||'')+' show';
  el.innerHTML='<i class="ti ti-'+(kind==='err'?'alert-triangle':'circle-check')+'"></i> '+esc(msg);
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.className='nt-toast '+(kind||''); }, 3200);
}
window.ntToast=ntToast;

/* ---------- Firebase bridge (module → classic) ---------- */
async function dbSet(path,val){ if(!window.ntSet) return; try{ return await window.ntSet(path, val===undefined?null:JSON.parse(JSON.stringify(val))); }catch(e){ console.error('save failed:',path,e); ntToast('Save failed: '+((e&&e.message)||e),'err'); throw e; } }
async function dbRemove(path){ if(window.ntRemove) return window.ntRemove(path); }
async function upload(file,sub){ if(window.ntUpload) return window.ntUpload(file, NT_UID, sub); return ''; }

window.ntOnData=(name,val)=>{
  if(name==='notes') NOTES=val||{};
  else if(name==='orders') ORDERS=val||{};
  render();
};
window.ntOnAuth=(user)=>{
  NT_USER=user; NT_UID=user?user.uid:null;
  if(!user){ $('nt-app').style.display='none'; $('nt-dock').style.display='none'; return; }
  $('nt-app').style.display='block'; $('nt-dock').style.display='flex';
  render();
};
window._ntPin=(e)=>{ e&&e.stopPropagation(); const p=document.body.classList.toggle('sb-pinned'); const ic=$('nt-pin-ico'); if(ic) ic.className='ti '+(p?'ti-pinned':'ti-pin'); };

/* ---------- routing / render ---------- */
window.showNtPage=(p)=>{ pinnedOnly=(p==='pinned'); page='list'; editId=null; _pendingPhotos=[]; render(); };
window.ntNew=()=>{ editId=null; page='edit'; render(); };
window.ntOpen=(id)=>{ editId=id; page='edit'; render(); };
window.ntBack=()=>{ editId=null; page='list'; _pendingPhotos=[]; render(); };

function setActive(){
  document.querySelectorAll('.dock-tab').forEach(tb=>tb.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const key = page==='edit'?null:(pinnedOnly?'pinned':'all');
  if(key){ const d=$('dock-'+key), nv=$('nav-'+key); if(d) d.classList.add('active'); if(nv) nv.classList.add('active'); }
  const ttl=$('tb-title'), sub=$('tb-sub');
  if(page==='edit'){ if(ttl) ttl.textContent=editId?'Edit note':'New note'; if(sub) sub.textContent='Your private notes'; }
  else if(pinnedOnly){ if(ttl) ttl.textContent='Pinned'; if(sub) sub.textContent='Your pinned notes'; }
  else { if(ttl) ttl.textContent='Notes'; if(sub) sub.textContent='Your private notes'; }
}
function render(){
  if(!NT_USER) return;
  setActive();
  const c=$('content'); if(!c) return;
  if(page==='edit'){ if($('nt-editor')) return; c.innerHTML=viewEdit(); ntRenderChecklist(); ntRenderTags(); ntRenderPhotos(); return; }
  c.innerHTML=viewList();
}

/* ---------- list view ---------- */
function orderShort(id){ const o=ORDERS[id]; if(!o) return ''; return [o.customer,o.part||o.partNum].filter(Boolean).join(' · ')||o.id; }
function gridHtml(){
  const q=(($('nt-search')&&$('nt-search').value)||'').toLowerCase().trim();
  let list=vals(NOTES);
  if(filterTag) list=list.filter(n=>(n.tags||[]).includes(filterTag));
  if(pinnedOnly) list=list.filter(n=>n.pinned);
  if(q) list=list.filter(n=>
    (n.title||'').toLowerCase().includes(q) ||
    stripHtml(n.body||'').toLowerCase().includes(q) ||
    (n.tags||[]).join(' ').toLowerCase().includes(q) ||
    (n.checklist||[]).map(i=>i.text||'').join(' ').toLowerCase().includes(q)
  );
  list.sort((a,b)=> ((b.pinned?1:0)-(a.pinned?1:0)) || ((b.updatedAt||0)-(a.updatedAt||0)));
  if(!list.length) return `<div class="empty">${(q||filterTag||pinnedOnly)?'No notes match.':'No notes yet. Press New note to jot your first one.'}</div>`;
  return `<div class="note-grid">`+list.map(noteCard).join('')+`</div>`;
}
function noteCard(n){
  const total=(n.checklist||[]).length, done=(n.checklist||[]).filter(i=>i.done).length;
  const snip=esc(stripHtml(n.body||'').slice(0,240));
  return `<div class="note-card" onclick="ntOpen('${n.id}')">
    <button class="note-pin ${n.pinned?'on':''}" title="Pin" onclick="ntTogglePin('${n.id}',event)"><i class="ti ti-pin${n.pinned?'ned':''}"></i></button>
    ${n.title?`<div class="note-title">${esc(n.title)}</div>`:''}
    ${snip?`<div class="note-snippet">${snip}</div>`:''}
    ${total?`<div class="note-meta"><i class="ti ti-checkbox"></i> ${done}/${total}</div>`:''}
    ${(n.tags&&n.tags.length)?`<div class="note-tags">${n.tags.map(tg=>`<span class="tagchip">${esc(tg)}</span>`).join('')}</div>`:''}
    <div class="note-foot">
      ${(n.photos&&n.photos.length)?`<span><i class="ti ti-photo"></i> ${n.photos.length}</span>`:''}
      ${(n.orderId&&ORDERS[n.orderId])?`<span><i class="ti ti-link"></i> ${esc(orderShort(n.orderId))}</span>`:''}
      <span class="muted">${fmtWhen(n.updatedAt)}</span>
    </div>
  </div>`;
}
function viewList(){
  const tags=[...new Set(vals(NOTES).reduce((a,n)=>a.concat(n.tags||[]),[]))].sort();
  return `<div class="toolbar">
    <button class="btn primary" onclick="ntNew()"><i class="ti ti-plus"></i> New note</button>
    <div class="search-wrap"><i class="ti ti-search"></i><input id="nt-search" class="in" placeholder="Search notes…" oninput="ntRenderGrid()"></div>
  </div>
  ${tags.length?`<div class="tagfilter"><span class="tf ${!filterTag?'on':''}" data-tg="" onclick="ntFilterTag('',event)">All tags</span>${tags.map(tg=>`<span class="tf ${filterTag===tg?'on':''}" data-tg="${esc(tg)}" onclick="ntFilterTag('${jsSafe(tg)}',event)">${esc(tg)}</span>`).join('')}</div>`:''}
  <div id="nt-grid">${gridHtml()}</div>`;
}
window.ntRenderGrid=()=>{ const g=$('nt-grid'); if(g) g.innerHTML=gridHtml(); };
window.ntFilterTag=(tg,e)=>{ if(e) e.stopPropagation(); filterTag=(filterTag===tg)?'':tg; document.querySelectorAll('.tagfilter .tf').forEach(el=>el.classList.toggle('on', (el.dataset.tg||'')===filterTag)); ntRenderGrid(); };
window.ntTogglePin=async(id,e)=>{ if(e) e.stopPropagation(); const n=NOTES[id]; if(!n) return; await dbSet('notes/'+NT_UID+'/'+id, Object.assign({}, n, {pinned:!n.pinned})); };

/* ---------- editor ---------- */
function orderOptionsNt(sel){
  const list=vals(ORDERS).sort((a,b)=>(b.ordered||'').localeCompare(a.ordered||''));
  return `<option value="">— None —</option>`+list.map(o=>{
    const lbl=[o.customer,o.part||o.partNum,o.job?('Job '+o.job):'',o.po?('PO '+o.po):''].filter(Boolean).join(' · ');
    return `<option value="${esc(o.id)}" ${sel===o.id?'selected':''}>${esc(lbl||o.id)}</option>`;
  }).join('');
}
function viewEdit(){
  const n=editId?NOTES[editId]:null;
  _editChecklist=(n&&n.checklist)?JSON.parse(JSON.stringify(n.checklist)):[];
  _editTags=(n&&n.tags)?n.tags.slice():[];
  _editPhotos=(n&&n.photos)?n.photos.slice():[];
  _pendingPhotos=[];
  _editPinned=!!(n&&n.pinned);
  _photosCollapsed=!!(n&&n.photos&&n.photos.length);
  return `<div id="nt-editor">
    <div class="toolbar">
      <button class="btn" onclick="ntBack()"><i class="ti ti-arrow-left"></i> Back</button>
      <span class="sp" style="flex:1"></span>
      <button class="btn ${_editPinned?'primary':''}" id="nt-pin-btn" onclick="ntTogglePinEdit()"><i class="ti ti-pin${_editPinned?'ned':''}"></i> ${_editPinned?'Pinned':'Pin'}</button>
      ${n?`<button class="btn danger" onclick="ntDelete()"><i class="ti ti-trash"></i> Delete</button>`:''}
      <button class="btn primary" onclick="ntSave()"><i class="ti ti-device-floppy"></i> Save</button>
    </div>
    <div class="card">
      <input class="in note-titlein" id="nt-title" placeholder="Title" value="${esc(n?n.title:'')}">
      <div class="rt-toolbar">
        <button type="button" onmousedown="ntFmt(event,'formatBlock','H2')" title="Title">Title</button>
        <button type="button" onmousedown="ntFmt(event,'formatBlock','H3')" title="Heading">Heading</button>
        <button type="button" onmousedown="ntFmt(event,'formatBlock','P')" title="Body text">Body</button>
        <span class="rt-div"></span>
        <button type="button" onmousedown="ntFmt(event,'bold')" title="Bold"><b>B</b></button>
        <button type="button" onmousedown="ntFmt(event,'italic')" title="Italic"><i>I</i></button>
        <button type="button" onmousedown="ntFmt(event,'insertUnorderedList')" title="Bullet list"><i class="ti ti-list"></i></button>
      </div>
      <div class="rt-body" id="nt-body" contenteditable="true">${n?(n.body||''):''}</div>
    </div>
    <div class="card">
      <div class="card-title"><i class="ti ti-checkbox"></i> Checklist</div>
      <div id="nt-checklist"></div>
      <button class="btn sm" onclick="ntAddCheck()"><i class="ti ti-plus"></i> Add item</button>
    </div>
    <div class="card">
      <div class="grid2">
        <div class="field"><label class="fl">Tags</label>
          <input class="in" id="nt-tagin" placeholder="Type a tag, press Enter" onkeydown="ntTagKey(event)">
          <div id="nt-tags" class="note-tags" style="margin-top:8px"></div>
        </div>
        <div class="field"><label class="fl">Link to a job / order</label>
          <select class="in" id="nt-order">${orderOptionsNt(n?n.orderId:'')}</select>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title photos-head" onclick="ntTogglePhotos()"><i class="ti ti-photo"></i> Photos <span id="nt-photocount" class="muted"></span> <i class="ti ti-chevron-down" id="nt-photochev" style="margin-left:auto"></i></div>
      <div id="nt-photos-wrap">
        <label class="btn sm"><i class="ti ti-camera"></i> Add photos<input type="file" accept="image/*" multiple style="display:none" onchange="ntPickPhotos(this)"></label>
        <div class="thumbs" id="nt-photos"></div>
      </div>
    </div>
  </div>`;
}
window.ntFmt=(e,cmd,arg)=>{ e.preventDefault(); try{ document.execCommand(cmd,false,arg||null); }catch(err){} const b=$('nt-body'); if(b) b.focus(); };
window.ntTogglePinEdit=()=>{ _editPinned=!_editPinned; const b=$('nt-pin-btn'); if(b){ b.className='btn '+(_editPinned?'primary':''); b.innerHTML=`<i class="ti ti-pin${_editPinned?'ned':''}"></i> ${_editPinned?'Pinned':'Pin'}`; } };

/* checklist */
function ntRenderChecklist(){
  const c=$('nt-checklist'); if(!c) return;
  c.innerHTML=_editChecklist.map((it,i)=>`<div class="check-row">
    <input type="checkbox" ${it.done?'checked':''} onchange="ntToggleCheck(${i},this.checked)">
    <input class="in check-text" value="${esc(it.text||'')}" placeholder="List item" oninput="ntEditCheck(${i},this.value)">
    <button class="check-rm" onclick="ntRmCheck(${i})"><i class="ti ti-x"></i></button>
  </div>`).join('');
}
window.ntAddCheck=()=>{ _editChecklist.push({id:newId('ci'),text:'',done:false}); ntRenderChecklist(); const rows=document.querySelectorAll('#nt-checklist .check-text'); const last=rows[rows.length-1]; if(last) last.focus(); };
window.ntToggleCheck=(i,v)=>{ if(_editChecklist[i]) _editChecklist[i].done=!!v; };
window.ntEditCheck=(i,v)=>{ if(_editChecklist[i]) _editChecklist[i].text=v; };
window.ntRmCheck=(i)=>{ _editChecklist.splice(i,1); ntRenderChecklist(); };

/* tags */
window.ntTagKey=(e)=>{ if(e.key==='Enter'||e.key===','){ e.preventDefault(); ntAddTag(e.target.value); e.target.value=''; } };
window.ntAddTag=(v)=>{ v=String(v||'').replace(/["'\\]/g,'').trim(); if(!v) return; if(!_editTags.includes(v)) _editTags.push(v); ntRenderTags(); };
window.ntRmTag=(i)=>{ _editTags.splice(i,1); ntRenderTags(); };
function ntRenderTags(){ const c=$('nt-tags'); if(!c) return; c.innerHTML=_editTags.map((tg,i)=>`<span class="tagchip">${esc(tg)} <i class="ti ti-x" onclick="ntRmTag(${i})"></i></span>`).join(''); }

/* photos */
window.ntTogglePhotos=()=>{ _photosCollapsed=!_photosCollapsed; ntRenderPhotos(); };
window.ntPickPhotos=(inp)=>{ [...inp.files].forEach(f=>_pendingPhotos.push(f)); inp.value=''; if(_photosCollapsed){ _photosCollapsed=false; } ntRenderPhotos(); };
window.ntRmPhoto=(kind,i)=>{ if(kind==='saved') _editPhotos.splice(i,1); else _pendingPhotos.splice(i,1); ntRenderPhotos(); };
function ntRenderPhotos(){
  const wrap=$('nt-photos-wrap'), strip=$('nt-photos'), cnt=$('nt-photocount'), chev=$('nt-photochev');
  const total=_editPhotos.length+_pendingPhotos.length;
  if(cnt) cnt.textContent=total?('('+total+')'):'';
  if(chev) chev.className='ti ti-chevron-'+(_photosCollapsed?'right':'down');
  if(wrap) wrap.style.display=_photosCollapsed?'none':'block';
  if(!strip) return;
  let html='';
  _editPhotos.forEach((p,i)=>{ html+=`<div class="thumb-wrap"><img class="thumb" src="${esc(p.url)}"><button class="thumb-x" onclick="ntRmPhoto('saved',${i})"><i class="ti ti-x"></i></button></div>`; });
  _pendingPhotos.forEach((f,i)=>{ html+=`<div class="thumb-wrap"><span class="thumb thumb-pending"><i class="ti ti-photo"></i> ${esc(f.name)}</span><button class="thumb-x" onclick="ntRmPhoto('new',${i})"><i class="ti ti-x"></i></button></div>`; });
  strip.innerHTML=html;
}

/* save / delete */
window.ntSave=async ()=>{
  const title=gv('nt-title');
  const body=stripDangerous(($('nt-body')&&$('nt-body').innerHTML)||'');
  const checklist=_editChecklist.filter(i=>i.text&&i.text.trim());
  if(!title && !stripHtml(body).trim() && !checklist.length && !_pendingPhotos.length && !_editPhotos.length){ ntToast('Add a title or some content first.','err'); return; }
  const btns=document.querySelectorAll('#nt-editor .toolbar .btn'); btns.forEach(b=>b.disabled=true);
  try{
    const id=editId||newId('note');
    const prev=editId?NOTES[editId]:null;
    const photos=_editPhotos.slice();
    for(const f of _pendingPhotos){ try{ const u=await upload(f,'photos'); if(u) photos.push({name:f.name,url:u,type:f.type}); }catch(e){ console.warn('photo upload failed',e); } }
    const rec={
      id, title, body, checklist, tags:_editTags.slice(), orderId:gv('nt-order'), photos, pinned:_editPinned,
      createdAt:(prev&&prev.createdAt)||Date.now(), updatedAt:Date.now(), by:(NT_USER&&NT_USER.email)||''
    };
    await dbSet('notes/'+NT_UID+'/'+id, rec);
    _pendingPhotos=[]; editId=null; page='list'; render();
    ntToast('Saved.','ok');
  }catch(e){ btns.forEach(b=>b.disabled=false); }
};
window.ntDelete=async ()=>{
  if(!editId){ ntBack(); return; }
  if(!confirm('Delete this note? This cannot be undone.')) return;
  await dbRemove('notes/'+NT_UID+'/'+editId);
  editId=null; page='list'; render();
  ntToast('Note deleted.','ok');
};
</script>

<!-- ================= Firebase (module) ================= -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, set, update, remove, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
import { getStorage, ref as sRef, uploadBytesResumable, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
const firebaseConfig = {
  apiKey: "AIzaSyBA2_PQBpNIwdBAzg-EPG-OAyqTtJAFOeg",
  authDomain: "bsmp-orders.firebaseapp.com",
  databaseURL: "https://bsmp-orders-default-rtdb.firebaseio.com",
  projectId: "bsmp-orders",
  storageBucket: "bsmp-orders.firebasestorage.app",
  messagingSenderId: "924947028289",
  appId: "1:924947028289:web:c58c74e37ee51aa1b9e9c0"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(()=>{});

window.ntSet = (path,val)=> set(ref(db,path), val);
window.ntUpdate = (path,val)=> update(ref(db,path), val);
window.ntRemove = (path)=> remove(ref(db,path));
window.ntUpload = async (file, uid, sub)=>{
  const safe=(file.name||'file').replace(/[^A-Za-z0-9._-]/g,'_');
  const path='notes/'+uid+'/'+(sub||'misc')+'/'+Date.now()+'_'+Math.floor(Math.random()*1e4)+'_'+safe;
  const task=uploadBytesResumable(sRef(storage,path), file, {contentType:file.type});
  await task;
  return await getDownloadURL(task.snapshot.ref);
};

let _ordersStarted=false;
onAuthStateChanged(auth, (user)=>{
  const ov=document.getElementById('nt-login');
  const fd=document.getElementById('nt-foot-dot'), ft=document.getElementById('nt-foot-txt');
  if(user){
    if(ov) ov.style.display='none';
    if(fd) fd.style.background='#2f7d55'; if(ft) ft.textContent=(user.email||'').split('@')[0]||'Signed in';
    onValue(ref(db,'notes/'+user.uid), s=> window.ntOnData('notes', s.val()||{}));
    if(!_ordersStarted){ onValue(ref(db,'orders'), s=> window.ntOnData('orders', s.val()||{})); _ordersStarted=true; }
    window.ntOnAuth(user);
  } else {
    if(ov) ov.style.display='flex';
    if(fd) fd.style.background='#8a93a0'; if(ft) ft.textContent='Signed out';
    window.ntOnAuth(null);
  }
});
window._ntLogin = async ()=>{
  const email=(document.getElementById('nt-email').value||'').trim();
  const pass=document.getElementById('nt-pass').value;
  const err=document.getElementById('nt-login-err'), btn=document.getElementById('nt-login-btn');
  err.textContent=''; btn.disabled=true; btn.textContent='Signing in…';
  try{ await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ err.textContent=(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found')?'Incorrect email or password.':('Sign-in error: '+e.message); }
  finally{ btn.disabled=false; btn.textContent='Sign in'; }
};
window._ntLogout = ()=> signOut(auth);
document.addEventListener('keydown', e=>{
  const ov=document.getElementById('nt-login');
  if(e.key==='Enter' && ov && ov.style.display!=='none' && document.activeElement && (document.activeElement.id==='nt-email'||document.activeElement.id==='nt-pass')) window._ntLogin();
});
</script>
</body>
</html>
